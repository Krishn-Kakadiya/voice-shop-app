<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login - EchoAisle</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
  <link href="css/style.css" rel="stylesheet" />
</head>
<body>
  <nav class="navbar navbar-dark bg-dark px-3">
    <a class="navbar-brand fw-bold" href="/">
      <i class="bi bi-soundwave text-warning"></i> EchoAisle
    </a>
    <a class="btn btn-outline-light btn-sm" href="/">
      <i class="bi bi-arrow-left"></i> Back to home
    </a>
  </nav>

  <main class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-5">
        <div class="card">
          <div class="card-body">
            <h3 class="fw-bold mb-3 text-center">
              <i class="bi bi-shield-lock text-warning"></i> Shop Owner Login
            </h3>
            <p class="text-muted text-center small">
              Enter your admin username and password to manage products.
            </p>

            <form id="loginForm">
              <div class="mb-3">
                <label class="form-label">Username</label>
                <input id="username" class="form-control" autofocus required />
              </div>
              <div class="mb-3">
                <label class="form-label">Password</label>
                <input id="password" type="password" class="form-control" required />
              </div>
              <div id="loginError" class="alert alert-danger d-none"></div>
              <div class="d-grid">
                <button type="submit" class="btn btn-warning fw-bold">
                  <i class="bi bi-box-arrow-in-right"></i> Login
                </button>
              </div>
            </form>

          </div>
        </div>
      </div>
    </div>
  </main>

  <script>
    const form = document.getElementById('loginForm');
    const errorBox = document.getElementById('loginError');
    form.addEventListener('submit', async (ev) => {
      ev.preventDefault();
      errorBox.classList.add('d-none');
      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          username: document.getElementById('username').value,
          password: document.getElementById('password').value,
        }),
      });
      if (res.ok) {
        window.location.href = '/admin.html';
      } else {
        const data = await res.json().catch(() => ({}));
        errorBox.textContent = data.error || 'Login failed.';
        errorBox.classList.remove('d-none');
      }
    });
  </script>
</body>
</html>
