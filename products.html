<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>All Products - EchoAisle</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
  <link href="css/style.css" rel="stylesheet" />
</head>
<body>
  <nav class="navbar navbar-dark bg-dark px-3">
    <a class="navbar-brand fw-bold" href="/">
      <i class="bi bi-soundwave text-warning"></i> EchoAisle
    </a>
    <div>
      <a class="btn btn-outline-light btn-sm me-2" href="/">
        <i class="bi bi-mic"></i> Voice
      </a>
      <a class="btn btn-outline-warning btn-sm" href="/admin.html">
        <i class="bi bi-shield-lock"></i> Admin
      </a>
    </div>
  </nav>

  <main class="container py-4">
    <div class="d-flex align-items-center justify-content-between flex-wrap gap-2 mb-1">
      <h1 class="fw-bold mb-0">All Products</h1>
      <button id="readPageBtn" class="btn btn-outline-info">
        <i class="bi bi-volume-up-fill"></i> Read This Page
      </button>
    </div>
    <p class="text-muted mb-3">Tap "Add to list" to build a shopping list, then "Start guided shopping" to begin.<br>
      Tap <strong>Read Info</strong> on any product to hear its name, location, and step-by-step directions.</p>

    <!-- Search + filter -->
    <div class="row g-2 mb-3">
      <div class="col-md-8">
        <input id="searchInput" class="form-control" type="text" placeholder="Search products...">
      </div>
      <div class="col-md-4">
        <select id="categoryFilter" class="form-select">
          <option value="">All categories</option>
        </select>
      </div>
    </div>

    <!-- Cart bar -->
    <div id="cartBar" class="alert alert-warning d-flex justify-content-between align-items-center d-none">
      <div>
        <i class="bi bi-cart-fill"></i>
        <span id="cartCount" class="fw-bold">0</span> item(s) in your list
      </div>
      <div>
        <button id="clearCartBtn" class="btn btn-sm btn-outline-secondary me-2">Clear</button>
        <a id="startShoppingBtn" class="btn btn-sm btn-warning" href="#">
          <i class="bi bi-mic"></i> Start guided shopping
        </a>
      </div>
    </div>

    <!-- Products grid -->
    <div id="productsGrid" class="row g-3"></div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/products.js"></script>
</body>
</html>
